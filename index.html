<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Agri-AI OS | National Level Ultimate Master Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-deep: #03060c;
            --gold-prime: #e6c687;
            --gold-glow: rgba(230, 198, 135, 0.35);
            --card-glass: rgba(12, 18, 30, 0.96);
            --neon-blue: #00d2ff;
            --neon-green: #00ff88;
            --alert-red: #ff3b5c;
            --text-main: #f4f8fb;
            --text-muted: #94a3b8;
            --focus-border: #ffd700;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background: #03060c; color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #bootScreen {
            position: fixed; inset: 0; background: #03060c; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.1s ease;
        }
        #bootScreen.hidden { opacity: 0; pointer-events: none; }
        
        .apple-logo-boot {
            width: 75px; height: 75px; background: linear-gradient(135deg, #00d2ff, #00ff88);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 38px; box-shadow: 0 0 35px rgba(0, 210, 255, 0.7); border: 2px solid #fff;
            animation: pulseLogo 0.5s infinite alternate;
        }
        @keyframes pulseLogo { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        .boot-title {
            font-size: 1.5rem; letter-spacing: 4px; margin-top: 12px;
            background: linear-gradient(90deg, #00d2ff, #e6c687, #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
        }
        .boot-bar-container {
            width: 240px; height: 4px; background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; margin-top: 12px; overflow: hidden;
        }
        .boot-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, #00ff88); animation: loadInstant 0.1s ease-out forwards; }
        @keyframes loadInstant { to { width: 100%; } }

        .app-wrapper { width: 100%; max-width: 1400px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }

        header {
            background: var(--card-glass); border: 2px solid var(--gold-prime); border-radius: 20px;
            padding: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 25px var(--gold-glow);
            position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .app-logo {
            width: 48px; height: 48px; background: linear-gradient(135deg, #00d2ff, #00ff88);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 0 18px rgba(0, 210, 255, 0.5); border: 2px solid #fff;
        }

        header h1 {
            margin: 0; font-size: clamp(1.4rem, 3vw, 2.2rem);
            background: linear-gradient(90deg, #00d2ff, #f3e5ab, #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1.5px;
        }
        header p { margin: 0 0 8px 0; font-size: 0.95rem; color: var(--text-muted); }

        .top-btn-group { position: absolute; top: 16px; right: 20px; display: flex; gap: 10px; }
        .sync-btn-top, .mic-btn-top {
            background: rgba(0, 210, 255, 0.2); border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.1s;
        }
        .sync-btn-top:hover, .mic-btn-top:hover { background: var(--neon-blue); color: #03060c; }
        .mic-btn-top.listening { background: var(--alert-red); border-color: var(--alert-red); color: #fff; box-shadow: 0 0 15px var(--alert-red); animation: pulseMic 0.5s infinite alternate; }
        @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.08); } }

        .top-badges { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; }
        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 0.88rem; font-weight: 700;
            background: rgba(6, 12, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .badge-green { color: var(--neon-green); border-color: var(--neon-green); }
        .badge-blue { color: var(--neon-blue); border-color: var(--neon-blue); }
        .badge-red { color: var(--alert-red); border-color: var(--alert-red); }
        .sat-toggle { cursor: pointer; user-select: none; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; width: 100%; }

        .card {
            background: var(--card-glass); border: 2px solid rgba(0, 210, 255, 0.3); border-radius: 20px;
            padding: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column;
            justify-content: space-between; transition: transform 0.05s ease, border-color 0.05s ease, box-shadow 0.05s ease; position: relative;
        }

        .card.focused, .report-master-card.focused {
            border: 3px solid var(--focus-border) !important;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.95) !important;
            transform: scale(1.02); z-index: 15;
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-top h3 { margin: 0; font-size: 1.15rem; color: #ffffff; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        
        .box-tag-badge {
            background: linear-gradient(135deg, #ffd700, #ff8a00); color: #03060c;
            font-size: 0.75rem; font-weight: 900; padding: 2px 8px; border-radius: 8px;
        }

        .mini-spk {
            background: rgba(0, 210, 255, 0.2); border: 1px solid var(--neon-blue); color: var(--neon-blue);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.1s;
        }
        .mini-spk.speaking { background: var(--neon-green); color: #03060c; border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }

        .big-metric { font-size: 2.5rem; font-weight: 900; margin: 12px 0; color: #ffffff; }

        .info-note {
            font-size: 0.88rem; color: #e2e8f0; background: rgba(3, 6, 12, 0.9); padding: 12px;
            border-radius: 12px; border-left: 4px solid var(--neon-blue); line-height: 1.5; margin-top: 12px;
        }

        .card.human-alert { border-color: var(--alert-red) !important; box-shadow: 0 0 45px rgba(255, 59, 92, 0.75) !important; }
        .card.plant-active { border-color: var(--neon-green) !important; box-shadow: 0 0 45px rgba(0, 255, 136, 0.85) !important; }

        .cam-box { position: relative; width: 100%; height: 240px; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #334155; }
        video#webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        canvas#overlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

        .hud-pill-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 6; pointer-events: none; }
        .hud-tag {
            background: rgba(3, 6, 12, 0.92); border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 4px 10px; border-radius: 15px; font-size: 0.78rem; font-weight: 800;
        }

        .vision-banner {
            margin-top: 12px; padding: 10px; border-radius: 10px; text-align: center;
            font-size: 0.9rem; font-weight: 800; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
        }
        .vision-banner.is-human { background: rgba(255, 59, 92, 0.3); border-color: var(--alert-red); color: #ff99ac; }
        .vision-banner.is-plant { background: rgba(0, 255, 136, 0.3); border-color: var(--neon-green); color: var(--neon-green); }

        .btn-row { display: flex; gap: 10px; margin-top: 12px; }
        .action-btn {
            flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 900;
            font-size: 0.92rem; cursor: pointer; color: #fff;
            background: linear-gradient(135deg, #00c853, #008e3a); transition: all 0.1s;
        }
        .action-btn.stop-cam { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        
        .gesture-mode-btn { background: linear-gradient(135deg, #6200ea, #3700b3); border: 1px solid #bb86fc; }
        .gesture-mode-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff8a00); color: #03060c;
            border-color: #ffffff; box-shadow: 0 0 20px #ffd700;
        }

        .gesture-guide-strip {
            margin-top: 10px; padding: 8px 10px; border-radius: 10px;
            background: rgba(0, 210, 255, 0.1); border: 1px dashed rgba(0, 210, 255, 0.4);
            font-size: 0.8rem; color: #cbd5e1; text-align: center; line-height: 1.4;
        }

        .log-list {
            height: 180px; overflow-y: auto; background: rgba(4, 8, 15, 0.95);
            border: 1px solid var(--neon-blue); border-radius: 12px; padding: 12px;
            font-size: 0.88rem; font-family: monospace;
        }
        .log-entry { padding: 6px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); color: var(--neon-green); }

        .report-master-card {
            grid-column: 1 / -1;
            background: linear-gradient(145deg, rgba(12, 18, 30, 0.95), rgba(5, 9, 18, 0.98));
            border: 3px solid var(--gold-prime); border-radius: 24px; padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px var(--gold-glow);
            transition: transform 0.05s ease, border-color 0.05s ease, box-shadow 0.05s ease;
        }

        .report-scroll-area {
            width: 100%; max-height: 500px; overflow-y: auto; padding: 20px;
            background: rgba(3, 6, 12, 0.95); border: 2px solid var(--gold-prime);
            border-radius: 16px; margin: 16px 0; line-height: 1.7; font-size: 1.05rem;
        }

        .report-section-box { padding: 18px; border-radius: 14px; margin-bottom: 18px; background: rgba(255, 255, 255, 0.04); border-left: 6px solid var(--neon-blue); }
        .report-section-box.chilli-alert { border-left-color: var(--alert-red); background: rgba(255, 59, 92, 0.08); }
        .report-section-box.cabbage-safe { border-left-color: var(--neon-green); background: rgba(0, 255, 136, 0.08); }

        .report-section-box h4 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ffffff; }
        .report-section-box ul { margin: 0; padding-left: 20px; color: #e2e8f0; }
        .report-section-box li { margin-bottom: 8px; }

        .master-controls { display: flex; flex-wrap: wrap; gap: 12px; }
        .btn-gold {
            flex: 2; min-width: 260px; background: linear-gradient(135deg, #e6c687, #c59b45);
            color: #03060c; font-weight: 900; padding: 16px; border: none; border-radius: 14px;
            cursor: pointer; font-size: 1.05rem;
        }
        .btn-voice {
            flex: 1; min-width: 150px; background: rgba(0, 210, 255, 0.2); border: 2px solid var(--neon-blue);
            color: var(--neon-blue); font-weight: 800; padding: 16px; border-radius: 14px;
            cursor: pointer; font-size: 1.05rem;
        }
        .btn-voice.speaking { background: var(--neon-blue); color: #03060c; box-shadow: 0 0 20px var(--neon-blue); }
        .btn-mute {
            flex: 1; min-width: 140px; background: rgba(255, 59, 92, 0.2); border: 2px solid var(--alert-red);
            color: var(--alert-red); font-weight: 800; padding: 16px; border-radius: 14px;
            cursor: pointer; font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <div id="bootScreen">
        <div class="apple-logo-boot">🌱</div>
        <div class="boot-title">SMART AGRI-AI OS</div>
        <div class="boot-bar-container"><div class="boot-bar"></div></div>
    </div>

    <div class="app-wrapper">
        <header>
            <div class="app-logo">🌱</div>
            <div class="top-btn-group">
                <button class="mic-btn-top" id="micBtnTop" onclick="toggleVoiceCommand()">🎙️ माइक कमांड: OFF</button>
                <button class="sync-btn-top" onclick="resetTimerSync()">↻ रीसेट</button>
            </div>
            <h1>Smart Agri-AI Control Room</h1>
            <p>Raspberry Pi 5 + Sony IMX500 AI Camera | Open-Palm & Instant Voice Master Edition</p>
            <div class="top-badges">
                <span class="badge badge-blue" id="clockBadge">🕒 --:--:--</span>
                <span class="badge badge-blue">📶 Wi-Fi: Redmi 10 Power</span>
                <span class="badge badge-green sat-toggle" id="satBadge" onclick="toggleSatellite()">🛰️ Satellite: ON</span>
                <span class="badge badge-green" id="sigBadge">📡 Signal: -61 dBm (94%)</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Box A -->
            <div class="card" id="card-cycle">
                <div class="card-top">
                    <h3><span><span class="box-tag-badge">A</span> RPi 5 + Sony AI Cycle</span></h3>
                    <button class="mini
